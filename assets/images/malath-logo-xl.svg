<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Amiri:wght@700&amp;display=swap');
      .crest-stroke { stroke: #111827; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .crest-accent { stroke: #334155; stroke-width: 1.8; fill: none; }
      .crest-fill { fill: #111827; }
      .brand-title { font-family: 'Cinzel', serif; font-size: 34px; font-weight: 700; fill: #0F172A; letter-spacing: 8px; text-anchor: middle; }
      .brand-arabic { font-family: 'Amiri', 'Traditional Arabic', serif; font-size: 26px; font-weight: 700; fill: #1E293B; letter-spacing: 4px; text-anchor: middle; }
      .brand-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 600; fill: #475569; letter-spacing: 3.5px; text-anchor: middle; text-transform: uppercase; }
      .brand-by { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #64748B; letter-spacing: 2px; text-anchor: middle; }
      .brand-by span { font-weight: 700; fill: #0F172A; }
      .divider-line { stroke: #CBD5E1; stroke-width: 1; }
    </style>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Architectural Luxury Crest Emblem -->
  <g transform="translate(300, 52)">
    <!-- Outer architectural frame / diamond geometry -->
    <path d="M 0 -42 L 36 -6 L 0 30 L -36 -6 Z" fill="none" stroke="#CBD5E1" stroke-width="1.2" />
    <path d="M 0 -36 L 30 -6 L 0 24 L -30 -6 Z" fill="none" stroke="#E2E8F0" stroke-width="0.8" />
    
    <!-- Central Modernist Sanctuary Arch & Pillars ('M' Architectural Form) -->
    <!-- Center pinnacle -->
    <circle cx="0" cy="-22" r="2.2" fill="#0F172A" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Left Pillar & Arch of M -->
    <path d="M -18 18 L -18 -8 Q -18 -18 0 -22" fill="none" class="crest-stroke" />
    <!-- Right Pillar & Arch of M -->
    <path d="M 18 18 L 18 -8 Q 18 -18 0 -22" fill="none" class="crest-stroke" />
    
    <!-- Diagonal architectural rafters -->
    <line x1="-18" y1="-8" x2="0" y2="10" stroke="#334155" stroke-width="1.6" stroke-linecap="round" />
    <line x1="18" y1="-8" x2="0" y2="10" stroke="#334155" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Base architectural foundation -->
    <line x1="-26" y1="20" x2="26" y2="20" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <line x1="-16" y1="23" x2="16" y2="23" stroke="#94A3B8" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <!-- English Luxury Wordmark -->
  <text x="300" y="125" class="brand-title">MALATH</text>
  
  <!-- Arabic Wordmark -->
  <text x="300" y="156" class="brand-arabic">مَـــــــــــلَاذ</text>

  <!-- Decorative Delicate Separator Lines -->
  <line x1="150" y1="172" x2="260" y2="172" class="divider-line" />
  <circle cx="300" cy="172" r="2.5" fill="#475569" />
  <line x1="340" y1="172" x2="450" y2="172" class="divider-line" />

  <!-- Descriptor Subtitle -->
  <text x="300" y="193" class="brand-subtitle">Strategic Real Estate Consultancy &amp; Advisory</text>

  <!-- Sub-Branding -->
  <text x="300" y="218" class="brand-by">By <tspan font-weight="700" fill="#0F172A">properties-e</tspan></text>
</svg>
