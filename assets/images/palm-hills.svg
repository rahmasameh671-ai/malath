<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <style>
      .ph-title { font-family: 'Cinzel', serif, 'Trajan Pro'; font-size: 20px; font-weight: 700; fill: #111827; letter-spacing: 3px; }
      .ph-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; font-weight: 600; fill: #475569; letter-spacing: 4px; text-transform: uppercase; }
      .ph-tree { stroke: #111827; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <g transform="translate(24, 40)">
    <!-- Minimalist Palm motif -->
    <path d="M 0 16 Q 0 0 -14 -12" class="ph-tree" />
    <path d="M 0 16 Q 0 -6 -8 -16" class="ph-tree" />
    <path d="M 0 16 L 0 -18" class="ph-tree" stroke-width="2.2" />
    <path d="M 0 16 Q 0 -6 8 -16" class="ph-tree" />
    <path d="M 0 16 Q 0 0 14 -12" class="ph-tree" />
    <line x1="-12" y1="18" x2="12" y2="18" stroke="#111827" stroke-width="1.8" />
  </g>
  <g transform="translate(62, 36)">
    <text x="0" y="0" class="ph-title">PALM HILLS</text>
    <text x="2" y="16" class="ph-sub">DEVELOPMENTS</text>
  </g>
</svg>
