<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;family=Amiri:wght@700&amp;display=swap');
      .nav-crest { stroke: #0F172A; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .nav-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; fill: #0F172A; letter-spacing: 4px; }
      .nav-ar { font-family: 'Amiri', 'Traditional Arabic', serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .nav-by { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; font-weight: 500; fill: #64748B; letter-spacing: 1px; }
      .nav-by span { font-weight: 700; fill: #0F172A; }
    </style>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(24, 32)">
    <path d="M 0 -22 L 18 -4 L 0 14 L -18 -4 Z" fill="none" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="0" cy="-12" r="1.5" fill="#0F172A" />
    <line x1="0" y1="-10" x2="0" y2="8" stroke="#0F172A" stroke-width="1.4" />
    <path d="M -9 8 L -9 -3 Q -9 -10 0 -12" fill="none" class="nav-crest" />
    <path d="M 9 8 L 9 -3 Q 9 -10 0 -12" fill="none" class="nav-crest" />
    <line x1="-9" y1="-3" x2="0" y2="4" stroke="#334155" stroke-width="1.2" />
    <line x1="9" y1="-3" x2="0" y2="4" stroke="#334155" stroke-width="1.2" />
    <line x1="-14" y1="10" x2="14" y2="10" stroke="#0F172A" stroke-width="1.5" />
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(56, 26)">
    <text x="0" y="0" class="nav-title">MALATH</text>
    <text x="135" y="-1" class="nav-ar">ملاذ</text>
  </g>
  <g transform="translate(58, 44)">
    <text x="0" y="0" class="nav-by">By <span>properties-e</span> &bull; <tspan fill="#94A3B8">ADVISORY</tspan></text>
  </g>
</svg>
